# The knob-off endpoint: the same deployment with CUDA graphs off (enforce_eager).
# Deploy: anyscale service deploy -f service_eager.yaml --working-dir .
name: webinar-1105-engine-eager
image_uri: anyscale/ray-llm:2.59.0-py312-cu130
excludes: [".venv", "results"]
applications:
  - name: llm
    route_prefix: /
    import_path: knobs:build_app
    args:
      variant: eager
      model: qwen-0.5b
# One node: the replica, the proxy and the controller share the L4 host.
compute_config:
  head_node:
    instance_type: g6.4xlarge   # 1x L4 24 GB, 16 vCPU, 64 GB RAM
    resources:
      CPU: 16
      GPU: 1
  worker_nodes: []
  auto_select_worker_config: false
