# KVAwareRouter across four replicas. Shown, not run.
# Adapted from the Ray Serve LLM "KV-aware routing" user guide.
#
# KVAwareRouter is a Ray Serve LLM router, alpha. Each replica publishes vLLM's
# KV events; the ingress tokenizes the prompt and sends it to the replica with
# the lowest token load: the prefill left after its cached overlap, plus the
# prefill and decode work it already has. NVIDIA Dynamo's selection service
# does the scoring in-process; Ray handles discovery, dispatch and KV-event
# transport. The trade-off is cache against queue.
#
# Three requirements:
#   1. ai-dynamo>=1.4.0 in the image (the router imports dynamo.llm).
#      Without it the deployment raises "ai-dynamo is not installed".
#   2. Direct streaming, so one model per application.
#   3. Body forwarding at the ingress. Without it the router logs one warning
#      and balances on load only.
name: webinar-1105-scaling-kv-router

# Ray 2.59.0 + vLLM 0.27.0, with ai-dynamo added on top.
containerfile: Containerfile.kv-router

# Service level, so the Serve controller and its proxies inherit them. They
# are read once at controller start: changing one needs a new cluster.
env_vars:
  RAY_SERVE_ENABLE_HA_PROXY: "1"
  RAY_SERVE_LLM_ENABLE_DIRECT_STREAMING: "1"
  RAY_SERVE_INGRESS_REQUEST_ROUTER_FORWARD_BODY: "1"
  # HAProxy hands the router only this much of each body (8 MiB default).
  # A longer prompt is routed on its prefix; watch
  # serve_haproxy_ingress_router_truncations_total.
  RAY_SERVE_HAPROXY_INGRESS_REQUEST_ROUTER_BUFSIZE: "8388608"
  # Counts routing failures and fallbacks to non-KV-aware routing.
  RAY_SERVE_INGRESS_REQUEST_ROUTER_METRICS_ENABLED: "1"

applications:
  - name: kv-router
    route_prefix: /
    import_path: ray.serve.llm:build_openai_app
    args:
      llm_configs:
        - model_loading_config:
            model_id: qwen3-8b
            model_source: Qwen/Qwen3-8B
          accelerator_type: L40S
          deployment_config:
            # Fixed size. Routing needs several replicas to choose between.
            autoscaling_config: {min_replicas: 4, max_replicas: 4}
            request_router_config:
              request_router_class: ray.serve.llm.request_router.KVAwareRouter
          runtime_env:
            env_vars:
              # Weight of prefill load against decode load (default 1.0). The
              # GLM service runs 16 for long, prefill-heavy agent prompts.
              # Dynamo ignores misspelled DYN_* names without a warning.
              DYN_ROUTER_PREFILL_LOAD_SCALE: "4.0"
          engine_kwargs:
            max_model_len: 32768
            enable_prefix_caching: true  # the cache the router scores

compute_config:
  head_node:
    instance_type: m5.2xlarge
  worker_nodes:
    - name: l40s
      instance_type: g6e.2xlarge  # 1x L40S 48 GB per replica
      min_nodes: 4
      max_nodes: 4
      market_type: ON_DEMAND
