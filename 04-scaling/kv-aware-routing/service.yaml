# KV-aware routing across four Qwen3-8B replicas, one L40S each.
#
#   anyscale service deploy -f service.yaml --working-dir .
#
# Three requirements, all set here:
#   1. ai-dynamo-runtime in the image (the router imports dynamo.llm); see Containerfile.
#   2. Direct streaming, so HAProxy asks the router and streams from the replica.
#   3. Body forwarding at the ingress; without it the router balances on load only.
name: webinar-1105-kv-routing

# Ray 2.59.0 + vLLM 0.27.0, with ai-dynamo-runtime added on top.
containerfile: Containerfile

# Service level, so the Serve controller and its proxies start with them. They
# are read once at controller start: changing one needs a new cluster.
env_vars:
  RAY_SERVE_ENABLE_HA_PROXY: "1"
  RAY_SERVE_LLM_ENABLE_DIRECT_STREAMING: "1"
  RAY_SERVE_INGRESS_REQUEST_ROUTER_FORWARD_BODY: "1"
  # HAProxy hands the router at most this many bytes of each body. Ray 2.59's
  # default is 256 KiB, about 60K tokens of JSON, shorter than a long agent
  # history; 8 MiB is the default on Ray master. A longer body is routed on its
  # prefix. Memory cost is about 2 x bufsize per open connection.
  RAY_SERVE_HAPROXY_INGRESS_REQUEST_ROUTER_BUFSIZE: "8388608"
  # Counts routing failures and fallbacks to load-only routing.
  RAY_SERVE_INGRESS_REQUEST_ROUTER_METRICS_ENABLED: "1"

working_dir: .
applications:
  - name: kv-routing
    route_prefix: /
    import_path: app:build_app
    args:
      replicas: 4
      prefill_load_scale: 4.0  # S: weight on what is left to compute

compute_config:
  head_node:
    instance_type: m5.2xlarge
  worker_nodes:
    - name: l40s
      instance_type: g6e.2xlarge  # 1x L40S 48 GB per replica
      min_nodes: 4
      max_nodes: 4
      market_type: ON_DEMAND
